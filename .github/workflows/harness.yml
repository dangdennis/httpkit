name: HTTP toolkit validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  correctness:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: 5.5.0
          - os: macos-14
            compiler: 5.5.0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: "2026.6.10"
          install_args: opam
      # mise installs opam; opam bootstraps Dune; Dune locks supply the test compiler.
      - uses: ./.github/actions/native-dependencies
      - run: tools/bootstrap ${{ matrix.compiler }}
      - run: tools/dev evidence validate ${{ matrix.compiler }}
      - run: tools/dev databases
      - run: tools/dev databases --binary _build-pkg-5.5.0/default/test/extensions/sql_session_test.exe
      - run: tools/dev framework-load --mode smoke
      - run: tools/dev bench-test
      # Workload correctness is gating; timing on shared CI hosts is advisory.
      - run: tools/dev bench --quick --samples 3
        env:
          HARNESS_COMPILER: ${{ matrix.compiler }}
      - run: tools/dev bench --external --quick --samples 3
        env:
          HARNESS_COMPILER: ${{ matrix.compiler }}
      - run: mise run setup:nginx
      - run: tools/dev interop
        env:
          HARNESS_COMPILER: ${{ matrix.compiler }}
      - run: tools/dev personal-load --mode smoke
        env:
          HARNESS_COMPILER: ${{ matrix.compiler }}
      - run: tools/dev performance
        env:
          HARNESS_COMPILER: ${{ matrix.compiler }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: harness-${{ matrix.os }}-${{ matrix.compiler }}
          path: _artifacts/
  # AFL is skipped by project policy. Native seeded parser/application smoke
  # runs through dune runtest in the correctness job; campaign gates stay open.
  release-tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: "2026.6.10"
          install_args: opam
      - uses: ./.github/actions/native-dependencies
      - run: tools/bootstrap 5.5.0
      - run: tools/dev selftest checks
      - run: tools/dev selftest release
      - run: tools/dev coverage
      - run: tools/dev mutations
      - run: tools/dev coverage framework
      - run: tools/dev mutations framework
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: harness-release-tooling
          path: _artifacts/
