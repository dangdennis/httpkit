name: HTTP toolkit validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  correctness:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: 5.5.0
          - os: macos-14
            compiler: 5.5.0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: "2026.6.10"
          install_args: opam
      # mise installs opam; opam bootstraps Dune; Dune locks supply the test compiler.
      - run: python3 tools/bootstrap.py ${{ matrix.compiler }}
      - run: python3 tools/evidence.py validate ${{ matrix.compiler }}
      - run: mise run setup:nginx
      - run: python3 tools/interop.py
        env:
          HARNESS_COMPILER: ${{ matrix.compiler }}
      - run: python3 tools/performance.py
        env:
          HARNESS_COMPILER: ${{ matrix.compiler }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: harness-${{ matrix.os }}-${{ matrix.compiler }}
          path: _artifacts/
  instrumentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: "2026.6.10"
          install_args: opam
      - run: python3 tools/bootstrap.py 5.5.0
      - run: mise run setup:afl
      - run: python3 tools/fuzz-smoke.py
      - run: python3 tools/campaign.py --seconds 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: harness-afl
          path: _artifacts/
  release-tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: "2026.6.10"
          install_args: opam
      - run: python3 tools/bootstrap.py 5.5.0
      - run: python3 tools/test_release.py
      - run: python3 tools/coverage.py
      - run: python3 tools/mutations.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: harness-release-tooling
          path: _artifacts/
