[tools]
opam = "2.5.2"

[tasks.setup]
description = "Install Dune with opam, then build Dune-locked dependencies"
run = "python3 tools/bootstrap.py"

[tasks.test]
description = "Run the HTTP harness"
run = "tools/harness run --tier fast"

[tasks."setup:afl"]
description = "Build the pinned native AFL++ tools"
run = "sh tools/setup-afl.sh"

[tasks.docs]
description = "Build API documentation with the locked odoc"
run = "tools/dune-pkg build @doc"

[tasks.bench]
description = "Run repeated release-profile benchmarks across all primitives"
run = "python3 tools/benchmarks.py"

[tasks."bench:core"]
run = "python3 tools/benchmarks.py --family core"

[tasks."bench:router"]
run = "python3 tools/benchmarks.py --family router"

[tasks."bench:parsers"]
run = "python3 tools/benchmarks.py --family http1"

[tasks."bench:middleware"]
run = "python3 tools/benchmarks.py --family middleware"

[tasks."bench:engine"]
run = "python3 tools/benchmarks.py --family engine"

[tasks."bench:compare"]
description = "Compare common workloads against Routes, http/af and httpun"
run = "python3 tools/benchmarks.py --external"

[tasks."bench:bodies"]
description = "Compare public body-reading APIs across framing and fragmentation variants"
run = "python3 tools/benchmarks.py --external --family body"

[tasks."bench:router-experiment"]
description = "Check and measure the benchmark-only route candidate index"
run = "python3 tools/benchmarks.py --external --family router-experiment"

[tasks."setup:nginx"]
description = "Build the pinned local Nginx interop reference"
run = "tools/setup-nginx.sh"

[tasks.interop]
description = "Run direct and real Nginx HTTP/1 interoperability lanes"
run = "python3 tools/interop.py"

[tasks.performance]
description = "Measure streaming bounds and advisory native mixed workloads"
run = "python3 tools/performance.py"
